<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.8rem;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    /* Add task form */
    .add-form {
      display: flex;
      gap: 10px;
    }

    .add-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input:focus { border-color: #6366f1; }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 0.8rem; }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1.5px solid #ddd;
      border-radius: 20px;
      background: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    /* Task list */
    #task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: opacity 0.2s;
    }

    .task-item.done .task-title {
      text-decoration: line-through;
      color: #999;
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-title {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
    }

    .task-date {
      font-size: 0.75rem;
      color: #aaa;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 32px 0;
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Tasks</h1>

    <div class="card">
      <form class="add-form" id="add-form">
        <input type="text" id="new-title" placeholder="Add a new task…" autocomplete="off" />
        <button class="btn btn-primary" type="submit">Add</button>
      </form>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <ul id="task-list"></ul>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const list = document.getElementById('task-list');
    const form = document.getElementById('add-form');
    const input = document.getElementById('new-title');
    const toast = document.getElementById('toast');
    let currentFilter = 'all';

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    async function loadTasks() {
      const url = currentFilter === 'all' ? '/tasks'
                : currentFilter === 'done' ? '/tasks?done=true'
                : '/tasks?done=false';
      const res = await fetch(url);
      const data = await res.json();
      renderTasks(data.tasks);
    }

    function renderTasks(tasks) {
      list.innerHTML = '';
      if (!tasks.length) {
        list.innerHTML = '<li class="empty">No tasks here.</li>';
        return;
      }
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.innerHTML = `
          <input type="checkbox" ${task.done ? 'checked' : ''} data-id="${task.id}" />
          <span class="task-title">${escHtml(task.title)}</span>
          <span class="task-date">${formatDate(task.createdAt)}</span>
          <button class="btn btn-danger" data-del="${task.id}">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Create
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      input.value = '';
      showToast('Task added');
      loadTasks();
    });

    // Toggle done / Delete (event delegation)
    list.addEventListener('change', async e => {
      if (!e.target.dataset.id) return;
      await fetch(`/tasks/${e.target.dataset.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: e.target.checked }),
      });
      loadTasks();
    });

    list.addEventListener('click', async e => {
      if (!e.target.dataset.del) return;
      await fetch(`/tasks/${e.target.dataset.del}`, { method: 'DELETE' });
      showToast('Task deleted');
      loadTasks();
    });

    // Filters
    document.querySelector('.filters').addEventListener('click', e => {
      if (!e.target.dataset.filter) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      loadTasks();
    });

    loadTasks();
  </script>
</body>
</html>
